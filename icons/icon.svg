<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c1e"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff453a"/>
      <stop offset="50%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ffd60a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fondo Redondeado iOS Squircle -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="113" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="4"/>
  
  <!-- Círculos de Ondas Sísmicas -->
  <circle cx="256" cy="275" r="140" fill="none" stroke="url(#waveGrad)" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="275" r="95" fill="none" stroke="url(#waveGrad)" stroke-width="4" opacity="0.45"/>
  <circle cx="256" cy="275" r="50" fill="none" stroke="url(#waveGrad)" stroke-width="5" opacity="0.7"/>

  <!-- Punto Central Epicentro -->
  <circle cx="256" cy="275" r="16" fill="#ff453a" filter="url(#glow)"/>
  <circle cx="256" cy="275" r="9" fill="#ffffff"/>

  <!-- Trazado Sismográfico / Pulso -->
  <path d="M 60 275 L 170 275 L 195 210 L 225 350 L 256 120 L 285 390 L 315 230 L 340 275 L 452 275" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="14" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>
</svg>
